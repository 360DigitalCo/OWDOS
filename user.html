<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWDOS User</title><link rel="stylesheet" href="system.css"></head><body data-page="user"><script type="module">import {pageFrame,esc,bindRecoveryChord,currentSession,redirect,userName} from './page.js'; const s=await currentSession(); const u=s?.user; pageFrame({eyebrow:'USER SESSION',title:u?`Continue as ${userName(u)}.`:'Choose an OWDOS account.',subtitle:u?'Your local disk and installed apps will mount for this user.':'No account is active on this device yet.',body:u?`<div class="light-card" style="background:#11161c;color:#f4f6f8;border-color:#252c35"><div style="display:flex;align-items:center;gap:15px"><div class="brand-mark">${esc(userName(u).slice(0,1).toUpperCase())}</div><div><b style="font-size:13px">${esc(userName(u))}</b><div style="margin-top:4px;color:#8b95a1;font-size:10px">${esc(u.email||'')}</div></div></div></div><div class="button-row"><a class="button ghost" href="welcome.html">Switch user</a><button class="button primary" id="continue">Continue</button></div>`:`<div class="status">No active OWDOS session. Continue to the login page.</div><div class="button-row"><a class="button ghost" href="welcome.html">Back</a><a class="button primary" href="login.html">Sign in</a></div>`,footer:`<span>${esc(location.hostname)}</span><span>OWDOS account service</span>`}); document.querySelector('#continue')?.addEventListener('click',()=>redirect('desktop.html')); bindRecoveryChord();</script></body></html>
