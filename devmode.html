<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWDOS Developer Mode</title><link rel="stylesheet" href="system.css"></head><body data-page="devmode"><script type="module">import {pageFrame,esc,bindRecoveryChord,getDeviceId,loadDevice,saveDevice,saveSnapshot,revertDevice,redirect,confirmAction} from './page.js'; const d=loadDevice(); const fakeExploits=[['sh1ttyoobe','0.3 · OOBE parser lab','Simulated OOBE-state corruption that marks the local device as developer-unlocked.'],['bootbreak','0.5 · boot chain lab','Simulated boot verification bypass for the OWDOS firmware model.'],['tpmglitch','0.6 · TPM lab','Simulated TPM rollback that switches the local TPM profile.'],['devunlock','1.0 · provisioning lab','Simulated service-mode unlock for this device only.']]; pageFrame({eyebrow:'DEVELOPER MODE',title:'Unverified OWDOS environment.',subtitle:'Developer mode turns off the local trust-chain check. Everything here is confined to the OWDOS device model.',body:`${systemCard([['Device',getDeviceId()],['Kernel',d.kernelVersion],['TPM',d.tpmVersion],['Firmware',d.firmwareVersion]])}<div class="admin-nav"><button class="active" data-tab="overview">Overview</button><button data-tab="exploits">Exploit lab</button><button data-tab="firmware">Firmware</button></div><div class="admin-panel active" data-panel="overview"><div class="status">Developer mode is ${d.devMode?'enabled':'disabled'}.</div><div class="button-row"><button class="button primary" id="toggle">${d.devMode?'Disable developer mode':'Enable developer mode'}</button><button class="button" id="revert">Revert</button><button class="button danger" id="powerwash">Powerwash device</button></div></div><div class="admin-panel" data-panel="exploits"><div class="exploit-grid">${fakeExploits.map(([id,v,desc])=>`<article class="exploit"><b>${esc(id)}</b><small>${esc(v)}<br>${esc(desc)}</small><button class="button" data-exploit="${id}">Run lab scenario</button></article>`).join('')}</div><div id="exploit-status" class="status"></div></div><div class="admin-panel" data-panel="firmware"><div class="stack"><label class="field">Kernel<select id="kernel"><option>0.4.0-legacy</option><option>0.5.0-ow</option><option>0.6.0-ow</option><option>0.6.0-dev</option></select></label><label class="field">TPM<select id="tpm"><option>1.2-compat</option><option>2.0.1-virtual</option><option>2.0.1-virtual-glitch</option></select></label></div><div class="button-row"><button class="button primary" id="savefw">Apply firmware profile</button></div></div><div class="button-row"><a class="button ghost" href="index.html">Bootloader</a><a class="button ghost" href="recovery.html">Recovery</a><a class="button ghost" href="admin.html">Admin console</a></div>`,footer:'OWDOS developer environment · simulated firmware controls'}); function systemCard(items){return `<div class="facts-grid">${items.map(([a,b])=>`<div class="fact"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`).join('')}</div>`} const tabs=[...document.querySelectorAll('[data-tab]')],panels=[...document.querySelectorAll('[data-panel]')]; tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));panels.forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelector(`[data-panel="${t.dataset.tab}"]`).classList.add('active')}); document.querySelector('#toggle').onclick=()=>{d.devMode=!d.devMode;saveDevice(d);location.reload()}; document.querySelector('#revert').onclick=()=>{if(revertDevice(d))location.reload();else document.querySelector('[data-panel="overview"] .status').textContent='No snapshot is available.'}; document.querySelector('#powerwash').onclick=async()=>{if(await confirmAction('Powerwash device','Remove all OWDOS-local state and return to first boot.','Powerwash device')){resetDevice();location.assign('index.html')}}; document.querySelector('#kernel').value=d.kernelVersion;document.querySelector('#tpm').value=d.tpmVersion;document.querySelector('#savefw').onclick=()=>{saveSnapshot(d,'before-firmware-change');d.kernelVersion=document.querySelector('#kernel').value;d.tpmVersion=document.querySelector('#tpm').value;saveDevice(d);location.reload()}; document.querySelectorAll('[data-exploit]').forEach(b=>b.onclick=()=>{saveSnapshot(d,b.dataset.exploit);const map={sh1ttyoobe:{kernel:'0.5.0-ow',tpm:'2.0.1-virtual-glitch',label:'sh1ttyoobe'},bootbreak:{kernel:'0.4.0-legacy',label:'bootbreak'},tpmglitch:{tpm:'2.0.1-virtual-glitch',label:'tpmglitch'},devunlock:{devMode:true,label:'devunlock'}};Object.assign(d,map[b.dataset.exploit]);d.devMode=true;saveDevice(d);document.querySelector('#exploit-status').className='status good';document.querySelector('#exploit-status').textContent=`${b.dataset.exploit} lab scenario activated. This only changed OWDOS local state.`}); bindRecoveryChord();</script></body></html>
