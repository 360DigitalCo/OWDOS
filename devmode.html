<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWDOS Developer Mode</title><link rel="stylesheet" href="system.css"><link rel="icon" href="favicon.svg"></head><body><div class="dev-page"><div class="dev-wrap"><div class="dev-banner">OS verification is OFF · OWDOS developer environment</div><h1 class="dev-title">Developer mode</h1><p class="dev-copy">Developer mode exposes OWDOS's simulated firmware controls, boot diagnostics, kernel selection and exploit lab. These effects exist only inside this OWDOS instance.</p><div class="dev-menu"><button id="admin"><b>Admin console</b><div class="dev-copy">Provision and inspect this device.</div></button><button id="recovery"><b>Recovery mode</b><div class="dev-copy">Repair, revert or Powerwash.</div></button><button id="exploit"><b>Exploit lab</b><div class="dev-copy">Run OWDOS-only simulated firmware experiments.</div></button><button id="toggle"><b id="toggle-label">Disable developer mode</b><div class="dev-copy">Return to verified boot.</div></button></div><div class="admin-box"><h2>Firmware state</h2><p id="facts"></p><button class="button ghost" id="boot" style="margin-top:10px">Back to bootloader</button></div></div></div><script type="module">import{loadDevice,getDeviceId,saveDevice,redirect}from'./page.js';const d=loadDevice();facts.textContent=`Device ${getDeviceId()} · FW ${d.firmwareVersion} · BL ${d.bootloaderVersion} · Kernel ${d.kernelVersion} · TPM ${d.tpmVersion}`;admin.onclick=()=>redirect('admin.html');recovery.onclick=()=>redirect('recovery.html');exploit.onclick=()=>redirect('admin.html',{tab:'lab'});toggle.onclick=()=>{d.devMode=false;saveDevice(d);redirect('bootloader.html')};boot.onclick=()=>redirect('bootloader.html');</script></body></html>
