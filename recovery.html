<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWDOS Recovery</title><link rel="stylesheet" href="system.css"><link rel="icon" href="favicon.svg"></head><body><div class="recovery-page"><header class="recovery-top"><div class="recovery-brand"><span class="recovery-mark">!</span><div><b>OWDOS Recovery</b><small>System recovery environment</small></div></div><div class="recovery-code" id="facts"></div></header><main class="recovery-main"><div class="eyebrow">RECOVERY</div><h1>Recover this device</h1><p>Repair the local operating environment, return to the last good snapshot, or erase the machine. Your Supabase account is not removed by Powerwash.</p><div class="recovery-grid"><button id="repair"><b>Repair filesystem</b><span>Rebuild local system metadata.</span></button><button id="revert"><b>Revert</b><span>Restore the last saved device snapshot.</span></button><button id="dev"><b>Developer mode</b><span>Open the development environment.</span></button><button id="boot"><b>Return to bootloader</b><span>Restart firmware selection.</span></button><button id="pw" class="danger-card"><b>Powerwash</b><span>Erase OWDOS device data and restart OOBE.</span></button><button id="off"><b>Power off</b><span>Stop the OWDOS firmware.</span></button></div><div class="recovery-note">Hardware shortcut: press <kbd>1</kbd> + <kbd>4</kbd> + <kbd>=</kbd> together from any OWDOS page.</div></main></div><script type="module">import{loadDevice,getDeviceId,saveDevice,revertDevice,resetDevice,confirmAction,redirect}from'./page.js';const d=loadDevice();facts.textContent=`${d.hostname} · ${getDeviceId()} · K ${d.kernelVersion} · TPM ${d.tpmVersion}`;repair.onclick=()=>{localStorage.setItem('owdos:fs-repair',new Date().toISOString());alert('Filesystem metadata repaired.');};revert.onclick=()=>{if(revertDevice(d))location.reload();else alert('No snapshot is available.');};dev.onclick=()=>redirect('devmode.html');boot.onclick=()=>redirect('bootloader.html');pw.onclick=async()=>{if(await confirmAction('Powerwash this device?','This erases OWDOS local state, Guest state, and setup data. Supabase accounts remain intact.','Powerwash')){resetDevice();location.replace('oobe.html')}};off.onclick=()=>document.body.innerHTML='<div class="powered-off">OWDOS is powered off.<br><span>Restart from the bootloader.</span></div>';</</script></body></html>
