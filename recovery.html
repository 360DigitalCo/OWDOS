<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWDOS Recovery</title><link rel="stylesheet" href="system.css"></head><body data-page="recovery"><main class="boot-screen"><section class="boot-card"><div class="boot-header"><div><div class="boot-logo">OW</div><div class="boot-title">OWDOS Recovery</div><div class="boot-sub">Local recovery environment · ${new Date().toISOString().slice(0,10)}</div></div><div class="boot-sub">RECOVERY</div></div><div class="boot-meta" id="meta"></div><div class="boot-menu" id="actions"></div><div id="status" class="status"></div><div class="boot-hint">Recovery is always reachable with 1 + 4 + =.</div></section></main><script type="module">import {bindRecoveryChord,esc,getDeviceId,loadDevice,saveDevice,revertDevice,confirmAction,resetDevice,redirect,currentSession,supabase} from './page.js'; const d=loadDevice(),meta=document.querySelector('#meta'),actions=document.querySelector('#actions'),status=document.querySelector('#status'); meta.innerHTML=[['Device',getDeviceId()],['Kernel',d.kernelVersion],['TPM',d.tpmVersion],['Devmode',d.devMode?'Enabled':'Disabled'],['Managed',d.managed?'Yes':'No'],['Snapshot',d.lastGoodSnapshot?'Available':'None'],['OOBE',d.oobeComplete?'Complete':'Required'],['Host',d.hostname]].map(([a,b])=>`<div><span>${a}</span><b>${esc(b)}</b></div>`).join(''); const list=[['continue','Continue normal boot'],['repair','Repair user filesystem'],['revert','Revert last good snapshot'],['settings','Reset setup settings'],['devmode','Enter developer mode'],['powerwash','Powerwash current account'],['device','Powerwash entire device'],['boot','Return to bootloader'],['shutdown','Power off']]; actions.innerHTML=list.map(([id,t])=>`<button data-action="${id}">${esc(t)}</button>`).join(''); async function act(id){if(id==='continue'){const s=await currentSession();return redirect(d.oobeComplete?(s?'user.html':'welcome.html'):'oobe.html')} if(id==='repair'){status.textContent='Checking local filesystem…';const s=await currentSession();if(!s){status.className='status bad';return status.textContent='Sign in to repair an account disk.'} localStorage.removeItem(`owdos:disk:${s.user.id}`);status.className='status good';status.textContent='Filesystem metadata will be rebuilt on next user boot.';return} if(id==='revert'){if(!revertDevice(d)){status.className='status bad';status.textContent='No recovery snapshot is available.'}else{status.className='status good';status.textContent='Last good device snapshot restored.';setTimeout(()=>location.reload(),500)}return} if(id==='settings'){d.oobeComplete=false;d.hostname='owdos';d.language='English (US)';d.keyboard='US';d.theme='midnight';d.accessibility=false;d.reduceMotion=false;saveDevice(d);status.className='status good';status.textContent='Setup settings reset. OOBE will run on the next boot.';return} if(id==='devmode'){d.devMode=true;saveDevice(d);redirect('devmode.html');return} if(id==='powerwash'){const ok=await confirmAction('Powerwash account','Erase this account’s local OWDOS disk and installed apps. Your Supabase account remains intact.','Powerwash');if(!ok)return;const s=await currentSession();if(s){Object.keys(localStorage).filter(k=>k.startsWith(`owdos:disk:${s.user.id}`)||k.startsWith(`owdos:installed:${s.user.id}`)||k.startsWith(`owdos:app:${s.user.id}:`)).forEach(k=>localStorage.removeItem(k))}status.className='status good';status.textContent='Account data was powerwashed locally.';return} if(id==='device'){const ok=await confirmAction('Powerwash device','Erase device state, all local user disks, OOBE state, snapshots, and developer settings. This does not delete Supabase accounts.','Powerwash device');if(!ok)return;resetDevice();location.assign('index.html');return} if(id==='boot')return redirect('index.html',{loader:'1'});if(id==='shutdown'){status.textContent='POWERED OFF';actions.innerHTML='<button id="restart">Restart OWDOS</button>';document.querySelector('#restart').onclick=()=>location.assign('index.html')}} actions.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action)); bindRecoveryChord();</script></body></html>
