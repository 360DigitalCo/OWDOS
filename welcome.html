<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to OWDOS</title><link rel="stylesheet" href="system.css"></head><body data-page="welcome"><script type="module">import {pageFrame,esc,bindRecoveryChord,currentSession,redirect,loadDevice} from './page.js'; const d=loadDevice(); pageFrame({eyebrow:'DEVICE LOGIN',title:'Welcome to OWDOS.',subtitle:'Choose how this device will open a session. OWDOS keeps account identity separate from the local operating system.',body:`<div class="choice-grid"><button class="choice" data-go="user"><div class="icon">U</div><b>Use an account</b><small>Sign in to an OWDOS account or create one.</small></button><button class="choice" data-go="guest"><div class="icon">G</div><b>Use Guest</b><small>Temporary local session. No account required.</small></button></div>${d.managed?`<div class="status good">This device is provisioned for an OWDOS account.</div>`:''}<div class="button-row"><a class="button ghost" href="index.html">Bootloader</a><a class="button ghost" href="recovery.html">Recovery</a></div>`,footer:`<span>Device ${esc(d.hostname)}</span><span>${esc(d.kernelVersion)} · TPM ${esc(d.tpmVersion)}</span>`}); qsa('[data-go]').forEach(b=>b.onclick=()=>redirect(b.dataset.go==='guest'?'guest.html':'user.html')); function qsa(s){return [...document.querySelectorAll(s)]} bindRecoveryChord();</script></body></html>
