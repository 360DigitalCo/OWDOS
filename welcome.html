<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to OWDOS</title><link rel="stylesheet" href="system.css"><link rel="icon" href="favicon.svg"></head><body><main class="system-page"><div class="system-top"><a class="brand" href="index.html"><span class="brand-mark">OW</span><span class="brand-name"><b>OWDOS</b><small>Ordbit Web Distro</small></span></a><span id="device-id" class="device-id"></span></div><div class="system-main"><section class="light-card"><div class="eyebrow">DEVICE LOGIN</div><h1>Welcome to OWDOS</h1><p class="lead">Choose a session. This is the login screen, not a fake settings modal pretending to be one.</p><div class="choice-grid"><button class="choice" onclick="location.href='login.html'"><span class="icon">U</span><b>Use an account</b><small>Sign in or create an OWDOS account.</small></button><button class="choice" onclick="location.href='guest.html'"><span class="icon">G</span><b>Use Guest</b><small>Temporary local session with no account.</small></button></div><div class="button-row"><button class="button ghost" onclick="location.href='recovery.html'">Recovery</button><button class="button ghost" onclick="location.href='bootloader.html'">Bootloader</button></div><div class="panel-foot"><span id="build"></span><span id="state"></span></div></section></div></main><script type="module">import{loadDevice,getDeviceId,currentSession}from'./page.js';const d=loadDevice();document.querySelector('#device-id').textContent=getDeviceId();document.querySelector('#build').textContent=`Kernel ${d.kernelVersion} · TPM ${d.tpmVersion}`;currentSession().then(s=>{if(s)location.replace('user.html')});</script></body></html>
