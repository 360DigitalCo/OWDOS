<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create OWDOS account</title><link rel="stylesheet" href="system.css"><link rel="icon" href="favicon.svg"></head><body><main class="system-page"><div class="system-top"><a class="brand" href="welcome.html"><span class="brand-mark">OW</span><span class="brand-name"><b>OWDOS</b><small>Create account</small></span></a></div><div class="system-main"><section class="auth-card"><div class="eyebrow">OWDOS ACCOUNT</div><h1>Create your account</h1><p class="lead">Supabase handles the authentication. OWDOS does not need your password in its own database.</p><form id="form" class="stack"><label class="field">Username<input id="username" pattern="[A-Za-z0-9_]{3,24}" minlength="3" maxlength="24" required></label><label class="field">Email<input id="email" type="email" autocomplete="email" required></label><label class="field">Password<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><label class="field">Confirm password<input id="password2" type="password" minlength="6" autocomplete="new-password" required></label><div class="button-row"><a class="button ghost" href="login.html">Back</a><button class="button primary">Create account</button></div></form><div id="msg" class="status"></div></section></div></main><script type="module">import{supabase,redirect}from'./page.js';form.onsubmit=async e=>{e.preventDefault();if(password.value!==password2.value)return msg.textContent='Passwords do not match.';const{data,error}=await supabase.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{username:username.value.trim()}}});if(error){msg.textContent=error.message;return}if(data.session)redirect('user.html');else msg.textContent='Account created. Check your email to confirm it, then sign in.'};</script></body></html>
