<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create OWDOS account</title><link rel="stylesheet" href="system.css"></head><body data-page="signup"><script type="module">import {pageFrame,esc,bindRecoveryChord,supabase,redirect} from './page.js'; const from=new URLSearchParams(location.search).get('from')||'user'; pageFrame({eyebrow:'OWDOS ACCOUNT',title:'Create your account.',subtitle:'Authentication lives in Supabase. The operating system itself remains local to this browser.',body:`<form id="form" class="stack"><label class="field">Username<input id="username" maxlength="24" autocomplete="username" required></label><label class="field">Email<input id="email" type="email" autocomplete="email" required></label><label class="field">Password<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><label class="field">Confirm password<input id="password2" type="password" minlength="6" autocomplete="new-password" required></label><div class="button-row"><a class="button ghost" href="${from==='oobe'?'oobe.html':'login.html'}">Back</a><button class="button primary">Create account</button></div><div id="message" class="status"></div></form>`,footer:'Supabase Auth · email/password'}); document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const username=document.querySelector('#username').value.trim(),email=document.querySelector('#email').value.trim(),a=document.querySelector('#password').value,b=document.querySelector('#password2').value,box=document.querySelector('#message');if(!/^[A-Za-z0-9_]{3,24}$/.test(username))return box.className='status bad',box.textContent='Username must be 3–24 characters using letters, numbers, or underscores.';if(a!==b)return box.className='status bad',box.textContent='Passwords do not match.';const {data,error}=await supabase.auth.signUp({email,password:a,options:{data:{username}}});if(error)return box.className='status bad',box.textContent=error.message;box.className='status good';box.textContent=data.session?'Account created.':'Account created. Confirm the email address, then sign in.';if(data.session)setTimeout(()=>redirect(from==='oobe'?'oobe.html':'user.html'),500)}); bindRecoveryChord();</script></body></html>
