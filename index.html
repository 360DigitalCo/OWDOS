<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111317">
  <title>OWDOS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23111317%27/%3E%3Ctext x=%2732%27 y=%2742%27 text-anchor=%27middle%27 font-family=%27Arial,sans-serif%27 font-size=%2728%27 font-weight=%27700%27 fill=%27%23fff%27%3EOW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" class="screen"></div>

  <main id="welcome" class="setup-screen hidden"></main>
  <main id="user" class="setup-screen hidden"></main>
  <main id="auth" class="setup-screen hidden">
    <section class="auth-card auth-page">
      <div class="auth-mark">OW</div>
      <div class="eyebrow">OWDOS ACCOUNT</div>
      <h1 id="auth-title">Sign in to OWDOS</h1>
      <p id="auth-subtitle" class="muted">Use your OWDOS account to continue.</p>
      <div class="auth-tabs">
        <button class="tab active" data-auth-tab="signin" type="button">Sign in</button>
        <button class="tab" data-auth-tab="signup" type="button">Create account</button>
      </div>
      <form id="auth-form">
        <label id="username-wrap" class="hidden">Username<input id="username" autocomplete="username" maxlength="24"></label>
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <label id="password2-wrap" class="hidden">Confirm password<input id="password2" type="password" autocomplete="new-password" minlength="6"></label>
        <button id="auth-submit" class="primary" type="submit">Sign in</button>
      </form>
      <button id="forgot-password" class="link-button" type="button">Forgot password?</button>
      <button id="auth-back" class="setup-back" type="button">Back</button>
      <div id="auth-message" class="message"></div>
    </section>
  </main>

  <main id="guest" class="setup-screen hidden"></main>

  <main id="desktop" class="desktop hidden">
    <div id="windows"></div>
    <div id="toast-area"></div>
    <div class="taskbar">
      <button id="launcher" class="task-button launcher" aria-label="Open applications">OW</button>
      <div id="task-list" class="task-list"></div>
      <div class="taskbar-spacer"></div>
      <div id="status-user" class="status-user"></div>
      <button id="clock" class="clock"></button>
    </div>
    <section id="launcher-menu" class="launcher-menu hidden">
      <div class="launcher-head">
        <strong>Applications</strong>
        <span id="launcher-user" class="muted"></span>
      </div>
      <div class="launcher-grid">
        <button class="app-launch" data-app="files"><span class="app-icon">▣</span><span>Files</span></button>
        <button class="app-launch" data-app="terminal"><span class="app-icon">›_</span><span>Terminal</span></button>
        <button class="app-launch" data-app="browser"><span class="app-icon">◎</span><span>Browser</span></button>
        <button class="app-launch" data-app="store"><span class="app-icon">+</span><span>OWD Store</span></button>
        <button class="app-launch" data-app="settings"><span class="app-icon">⚙</span><span>Settings</span></button>
        <button class="app-launch" data-app="monitor"><span class="app-icon">▥</span><span>System Monitor</span></button>
      </div>
    </section>
    <div id="desktop-context" class="context-menu hidden"></div>
  </main>

  <script src="coi-serviceworker.js?v=6"></script>
  <script type="module" src="main.js?v=6"></script>
</body>
</html>
