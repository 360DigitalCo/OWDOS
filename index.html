<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWDOS</title><link rel="stylesheet" href="system.css"><link rel="icon" href="favicon.svg"></head>
<body>
<div class="firmware-page"><div class="firmware-mark">OW</div><div class="firmware-name">OWDOS</div><div class="firmware-sub">Ordbit Web Distro Operating System</div><div class="firmware-lines" id="lines"></div><div class="firmware-bar"><span id="bar"></span></div><button id="skip">Boot options · F12</button></div>
<script type="module">
import {loadDevice,saveDevice,redirect,currentSession} from './page.js';
const d=loadDevice(), lines=document.querySelector('#lines'), bar=document.querySelector('#bar');
const qs=new URLSearchParams(location.search);
if(qs.get('loader')==='1'){location.replace('bootloader.html');}
const steps=[['ROM','Checking firmware'],['BL1','Loading Ordbit bootloader'],['KERNEL','Verifying kernel'],['TPM','Initializing virtual TPM'],['VFS','Mounting local filesystem'],['INIT','Starting userspace']];
let i=0;
function tick(){if(i===steps.length){return currentSession().then(s=>{if(!d.oobeComplete)location.replace('oobe.html');else location.replace(s?'user.html':'welcome.html')});}const [a,b]=steps[i++];const row=document.createElement('div');row.innerHTML=`<span>${a}</span><b>OK</b>`;lines.append(row);bar.style.width=((i/steps.length)*100)+'%';setTimeout(tick,170)} 
document.querySelector('#skip').onclick=()=>location.replace('bootloader.html');window.addEventListener('keydown',e=>{if(e.key==='F12'||e.key==='Escape'){e.preventDefault();location.replace('bootloader.html')}});
tick();
</script>
</body></html>
