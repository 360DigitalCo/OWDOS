<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWDOS Admin Console</title><link rel="stylesheet" href="system.css"></head><body data-page="admin"><script type="module">import {pageFrame,esc,bindRecoveryChord,getDeviceId,loadDevice,saveDevice,saveSnapshot,revertDevice,currentSession,redirect,confirmAction,resetDevice} from './page.js'; const d=loadDevice(); const s=await currentSession(); let verified=false; pageFrame({eyebrow:'DEVICE ADMINISTRATION',title:'Admin console.',subtitle:'Provisioning is bound to this exact local device. Enter the device ID and sign in to prove control of both the device and account.',body:`<div class="status">Account: ${esc(s?.user?.email || 'Not signed in')}</div><div class="stack"><label class="field">Device ID<input id="device-id" autocomplete="off" spellcheck="false" placeholder="${esc(getDeviceId())}"></label><div class="button-row" style="justify-content:space-between"><button class="button ghost" id="copy">Copy device ID</button><button class="button primary" id="verify">Verify ownership</button></div><div id="verify-status" class="status"></div></div><div id="admin-content" class="hidden"><div class="admin-nav"><button class="active" data-tab="device">Device</button><button data-tab="firmware">Firmware</button><button data-tab="exploit">Exploit lab</button><button data-tab="recovery">Recovery</button></div><div class="admin-panel active" data-panel="device"><div class="status good">Ownership verified for this browser device.</div><div class="button-row"><button class="button primary" id="provision">Provision this device</button><button class="button" id="revoke">Remove provisioning</button><button class="button danger" id="clear-managed">Clear owner</button></div></div><div class="admin-panel" data-panel="firmware"><div class="facts-grid">${[['Firmware',d.firmwareVersion],['Bootloader',d.bootloaderVersion],['Kernel',d.kernelVersion],['TPM',d.tpmVersion]].map(([a,b])=>`<div class="fact"><span>${a}</span><strong>${esc(b)}</strong></div>`).join('')}</div><div class="button-row"><button class="button" data-k="kernel">Next kernel</button><button class="button" data-k="tpm">Next TPM</button><button class="button" id="stable">Restore stable</button></div></div><div class="admin-panel" data-panel="exploit"><div class="exploit-grid"><article class="exploit"><b>sh1ttyoobe</b><small>Simulated OOBE exploit lab. Changes the local firmware model only.</small><button class="button" data-ex="sh1ttyoobe">Activate</button></article><article class="exploit"><b>bootbreak</b><small>Simulated boot-chain lab. No external exploit code or payloads.</small><button class="button" data-ex="bootbreak">Activate</button></article><article class="exploit"><b>tpmglitch</b><small>Simulated TPM rollback profile for testing recovery paths.</small><button class="button" data-ex="tpmglitch">Activate</button></article><article class="exploit"><b>devunlock</b><small>Simulated local service-mode unlock.</small><button class="button" data-ex="devunlock">Activate</button></article></div><div id="lab-status" class="status"></div></div><div class="admin-panel" data-panel="recovery"><div class="recovery-table">${[['Snapshot',d.lastGoodSnapshot?'Available':'None'],['Developer mode',d.devMode?'Enabled':'Disabled'],['Exploit state',d.exploitLab?.label||'None']].map(([a,b])=>`<div class="recovery-row"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div><div class="button-row"><button class="button" id="snapshot">Save snapshot</button><button class="button" id="revert">Revert</button><button class="button danger" id="powerwash">Powerwash device</button></div></div><div class="button-row"><a class="button ghost" href="index.html">Bootloader</a><a class="button ghost" href="recovery.html">Recovery</a><a class="button ghost" href="devmode.html">Developer mode</a></div></div>`,footer:`${esc(getDeviceId())} · local administration`}); document.querySelector('#copy').onclick=async()=>{await navigator.clipboard?.writeText(getDeviceId()).catch(()=>{});document.querySelector('#verify-status').className='status good';document.querySelector('#verify-status').textContent='Device ID copied.'}; document.querySelector('#verify').onclick=async()=>{const value=document.querySelector('#device-id').value.trim();const box=document.querySelector('#verify-status');if(value!==getDeviceId()){box.className='status bad';box.textContent='Device ID does not match this device.';return}if(!s){box.className='status bad';box.textContent='Sign in to an OWDOS account before provisioning.';return}verified=true;box.className='status good';box.textContent='Ownership verified.';document.querySelector('#admin-content').classList.remove('hidden')}; function gate(fn){return (...args)=>verified?fn(...args):document.querySelector('#verify-status').textContent='Verify device ownership first.'} const tabs=[...document.querySelectorAll('[data-tab]')],panels=[...document.querySelectorAll('[data-panel]')];tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));panels.forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelector(`[data-panel="${t.dataset.tab}"]`).classList.add('active')}); document.querySelector('#provision').onclick=gate(()=>{d.managed=true;d.managedOwnerId=s.user.id;saveDevice(d);location.reload()});document.querySelector('#revoke').onclick=gate(()=>{d.managed=false;d.managedOwnerId=null;saveDevice(d);location.reload()});document.querySelector('#clear-managed').onclick=gate(()=>{d.managed=false;d.managedOwnerId=null;saveDevice(d);location.reload()}); const kernels=['0.4.0-legacy','0.5.0-ow','0.6.0-ow','0.6.0-dev'],tpms=['1.2-compat','2.0.1-virtual','2.0.1-virtual-glitch'];document.querySelector('[data-k="kernel"]').onclick=gate(()=>{saveSnapshot(d,'before-kernel');d.kernelVersion=kernels[(kernels.indexOf(d.kernelVersion)+1)%kernels.length];saveDevice(d);location.reload()});document.querySelector('[data-k="tpm"]').onclick=gate(()=>{saveSnapshot(d,'before-tpm');d.tpmVersion=tpms[(tpms.indexOf(d.tpmVersion)+1)%tpms.length];saveDevice(d);location.reload()});document.querySelector('#stable').onclick=gate(()=>{saveSnapshot(d,'before-stable');d.kernelVersion='0.6.0-ow';d.tpmVersion='2.0.1-virtual';d.exploitLab=null;saveDevice(d);location.reload()});document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=gate(()=>{saveSnapshot(d,b.dataset.ex);d.exploitLab={id:b.dataset.ex,label:b.dataset.ex,version:'lab'};d.devMode=true;if(b.dataset.ex==='tpmglitch')d.tpmVersion='2.0.1-virtual-glitch';if(b.dataset.ex==='bootbreak')d.kernelVersion='0.4.0-legacy';saveDevice(d);document.querySelector('#lab-status').className='status good';document.querySelector('#lab-status').textContent=`${b.dataset.ex} activated. OWDOS firmware state changed locally.`}));document.querySelector('#snapshot').onclick=gate(()=>{saveSnapshot(d,'manual');location.reload()});document.querySelector('#revert').onclick=gate(()=>{if(revertDevice(d))location.reload();else document.querySelector('#lab-status').textContent='No snapshot is available.'});document.querySelector('#powerwash').onclick=gate(async()=>{if(await confirmAction('Powerwash device','Erase all OWDOS-local state and return to first boot. Supabase accounts are untouched.','Powerwash device')){resetDevice();location.assign('index.html')}});bindRecoveryChord();</script></body></html>
