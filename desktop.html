<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f204a"><title>OWDOS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
<link rel="stylesheet" href="system.css"><link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg"></head>
<body data-page="desktop">
<main id="boot" class="hidden"></main>
<main id="auth" class="hidden"></main>
<main id="welcome" class="hidden"></main>
<main id="user" class="hidden"></main>
<main id="guest" class="hidden"></main>
<div id="desktop">
  <div id="windows"></div>
  <div id="desktop-status"></div>
  <section id="launcher-menu" class="launcher-menu hidden">
    <div class="launcher-head"><strong>Applications</strong><span id="launcher-user" style="color:#aeb4c0"></span></div>
    <div class="launcher-grid">
      <button class="app-launch" data-app="files"><span class="app-icon">▣</span><span>Files</span></button>
      <button class="app-launch" data-app="terminal"><span class="app-icon">&gt;_</span><span>Terminal</span></button>
      <button class="app-launch" data-app="browser"><span class="app-icon">◉</span><span>Browser</span></button>
      <button class="app-launch" data-app="store"><span class="app-icon">+</span><span>OWD Store</span></button>
      <button class="app-launch" data-app="settings"><span class="app-icon">⚙</span><span>Settings</span></button>
      <button class="app-launch" data-app="monitor"><span class="app-icon">▥</span><span>System Monitor</span></button>
      <button class="app-launch" data-app="about"><span class="app-icon">i</span><span>About OWDOS</span></button>
    </div>
  </section>
  <section id="quick-panel" class="quick-panel hidden">
    <div class="panel-user"><div class="avatar" id="panel-avatar">O</div><div><b id="panel-name">OWDOS</b><span id="panel-email">Guest session</span></div></div>
    <div class="qs-grid">
      <button class="qs on" data-qs="wifi"><b>Wi-Fi</b><span>Connected</span></button>
      <button class="qs on" data-qs="bluetooth"><b>Bluetooth</b><span>On</span></button>
      <button class="qs" data-qs="dnd"><b>Do not disturb</b><span>Off</span></button>
      <button class="qs" data-qs="dark"><b>Dark mode</b><span>On</span></button>
    </div>
    <div class="qs-foot"><button class="panel-btn" id="qs-settings">Settings</button><button class="panel-btn" id="qs-lock">Lock</button><button class="panel-btn" id="qs-signout">Sign out</button></div>
  </section>
  <section id="notif-panel" class="notif-panel hidden">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>Notifications</h3><button class="panel-btn" id="clear-notifs">Clear all</button></div>
    <div id="notif-list">
      <article class="notif"><b>OWDOS system</b><p>Device services started successfully.</p></article>
      <article class="notif"><b>OWD Store</b><p>Community applications are available through the app registry.</p></article>
    </div>
  </section>
  <div class="taskbar">
    <button id="launcher" class="task-button launcher" aria-label="Launcher"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/></svg></button>
    <div id="task-list" class="task-list"></div>
    <div class="taskbar-spacer"></div>
    <div class="status-user" id="status-user"></div>
    <button class="task-button" id="notif-toggle" title="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
    <button class="task-button clock" id="clock" title="Quick Settings"></button>
  </div>
  <div id="desktop-context" class="context-menu hidden"></div>
</div>
<script src="coi-serviceworker.js?v=9"></script>
<script type="module" src="main.js?v=9"></script>
<script type="module" src="desktop-ui.js?v=9"></script>
</body>
</html>
