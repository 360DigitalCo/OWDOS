<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in to OWDOS</title><link rel="stylesheet" href="system.css"><link rel="icon" href="favicon.svg"></head><body><main class="system-page"><div class="system-top"><a class="brand" href="welcome.html"><span class="brand-mark">OW</span><span class="brand-name"><b>OWDOS</b><small>Account sign-in</small></span></a></div><div class="system-main"><section class="auth-card"><div class="eyebrow">OWDOS ACCOUNT</div><h1>Sign in</h1><p class="lead">Your account authenticates you. Your OWDOS files stay on this device.</p><form id="form" class="stack"><label class="field">Email<input id="email" type="email" autocomplete="email" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><div class="button-row"><a class="button ghost" href="welcome.html">Back</a><button class="button primary">Sign in</button></div></form><div class="button-row" style="justify-content:space-between"><button class="button ghost" id="signup" type="button">Create account</button><button class="button ghost" id="forgot" type="button">Forgot password</button></div><div id="msg" class="status"></div></section></div></main><script type="module">import{supabase,userName,redirect}from'./page.js';const msg=t=>{document.querySelector('#msg').textContent=t};form.onsubmit=async e=>{e.preventDefault();const{data,error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg(error.code==='email_not_confirmed'?'Confirm your email address first.':error.code==='invalid_credentials'?'The email or password is incorrect.':error.message);return}redirect('user.html')};signup.onclick=()=>redirect('signup.html');forgot.onclick=async()=>{const e=email.value.trim();if(!e)return msg('Enter your email first.');const{error}=await supabase.auth.resetPasswordForEmail(e,{redirectTo:`${location.origin}${location.pathname}?recovery=1`});msg(error?error.message:'If the address can receive account email, a recovery message has been sent.')};</script></body></html>
