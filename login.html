<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in to OWDOS</title><link rel="stylesheet" href="system.css"></head><body data-page="login"><script type="module">import {pageFrame,esc,bindRecoveryChord,supabase,currentSession,redirect} from './page.js'; const params=new URLSearchParams(location.search); const from=params.get('from')||'user'; const recovery=params.get('recovery')==='1'; pageFrame({eyebrow:'OWDOS ACCOUNT',title:recovery?'Choose a new password.':'Sign in to OWDOS.',subtitle:recovery?'Your recovery session is active.':'Your account is only used for identity and authentication. Files remain on this device.',body:`${!recovery?`<form id="login-form" class="stack"><label class="field">Email<input id="email" type="email" autocomplete="email" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><div class="button-row"><a class="button ghost" href="${from==='oobe'?'oobe.html':'welcome.html'}">Back</a><button class="button primary" id="submit">Sign in</button></div><div class="button-row" style="margin-top:8px;justify-content:space-between"><button class="button ghost" type="button" id="signup">Create account</button><button class="button ghost" type="button" id="forgot">Forgot password?</button></div>`:`<form id="recovery-form" class="stack"><label class="field">New password<input id="new-password" type="password" minlength="6" autocomplete="new-password" required></label><label class="field">Confirm password<input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required></label><div class="button-row"><button class="button primary">Update password</button></div>`}<div id="message" class="status"></div>`,footer:'Supabase Auth · email/password'}); const message=document.querySelector('#message'); const set=(t,good=false)=>{message.textContent=t;message.className=`status ${good?'good':'bad'}`}; if(recovery){const session=await currentSession();if(!session)set('Your recovery session is no longer active. Request another reset link.')} document.querySelector('#login-form')?.addEventListener('submit',async e=>{e.preventDefault();const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){set(error.code==='email_not_confirmed'?'Confirm your email address first.':error.code==='invalid_credentials'?'The email or password is incorrect.':error.message);return} redirect(from==='oobe'?'oobe.html':'user.html')}); document.querySelector('#signup')?.addEventListener('click',()=>redirect('signup.html',{from})); document.querySelector('#forgot')?.addEventListener('click',async()=>{const email=document.querySelector('#email').value.trim();if(!email)return set('Enter your email first.');const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:`${location.origin}${location.pathname}?recovery=1`});if(error)set(error.message);else set('If the address can receive account email, a recovery message has been sent.',true)}); document.querySelector('#recovery-form')?.addEventListener('submit',async e=>{e.preventDefault();const a=document.querySelector('#new-password').value,b=document.querySelector('#confirm-password').value;if(a!==b)return set('Passwords do not match.');const {error}=await supabase.auth.updateUser({password:a});if(error)return set(error.message);set('Password updated. You can continue into OWDOS.',true);setTimeout(()=>redirect('user.html'),650)}); bindRecoveryChord();</script></body></html>
