<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · OWDOS</title><link rel="icon" href="owdos.png"><link rel="stylesheet" href="owdos.css"><script src="system.js"></script><script src="auth.js"></script></head><body class="entry-screen"><main class="auth-page"><a class="back" href="welcome.html">← Back</a><div class="owdos-brand-mark">OW</div><h1>Sign in to OWDOS</h1><p>Use the email and password for your OWDOS account.</p><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form><button id="reset" class="text-btn">Forgot password?</button><div id="msg"></div><div class="auth-alt"><a href="signup.html">Create an account</a><a href="guest.html">Continue as Guest</a></div></main><script>
const form=document.getElementById('form'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const r=await OWAuth.signIn(email.value,password.value);if(r.error){msg.textContent=r.error.message.includes('Email not confirmed')?'Check your email before signing in.':r.error.message;return}OWSystem.set({guest:false});location.href='desktop.html';});document.getElementById('reset').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){msg.textContent='Enter your email first.';return}const r=await OWAuth.reset(email);msg.textContent=r.error?r.error.message:'Password reset email sent.'};</script><style>.auth-page{width:min(420px,92vw);background:#fff;border-radius:20px;padding:34px;box-shadow:0 28px 90px rgba(0,0,0,.3)}.auth-page .back{color:#656c75;text-decoration:none;font-size:12px}.auth-page>.owdos-brand-mark{margin:22px 0 16px}.auth-page h1{margin:0;font-weight:500;font-size:28px;letter-spacing:-.04em}.auth-page p{color:#69707a;font-size:13px;line-height:1.55}.auth-page form{display:grid;gap:14px;margin-top:24px}.auth-page label{display:grid;gap:7px;color:#3f454c;font-size:12px}.auth-page input{height:44px;padding:0 12px;border:1px solid #d5d9de;border-radius:9px;outline:none}.auth-page input:focus{border-color:#5965c8;box-shadow:0 0 0 3px rgba(89,101,200,.12)}.primary{height:44px;border:0;border-radius:9px;background:#4f5ec4;color:#fff;font-weight:600;cursor:pointer}.text-btn{border:0;background:transparent;color:#4f5ec4;cursor:pointer;margin-top:12px;padding:4px}#msg{min-height:18px;margin-top:12px;color:#626a74;font-size:12px}.auth-alt{display:flex;justify-content:space-between;margin-top:22px;font-size:12px}.auth-alt a{color:#4f5ec4;text-decoration:none}</style></body></html>
