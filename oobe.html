<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up OWDOS</title><link rel="stylesheet" href="system.css">
<link rel="icon" href="favicon.svg"></head>
<body>
<div class="oobe-page">
  <div class="oobe-bg"></div>
  <div class="oobe-status"><span id="oobe-network">Network</span><span id="oobe-time">--:--</span></div>
  <main class="oobe-card">
    <header class="oobe-head">
      <a class="brand" href="index.html"><span class="brand-mark">OW</span><span class="brand-name"><b>OWDOS</b><small>Ordbit Web Distro</small></span></a>
      <div class="oobe-device" id="device-id"></div>
    </header>
    <div class="oobe-progress" id="progress"></div>
    <section id="step"></section>
    <footer class="oobe-footer"><div id="a11y"></div><div class="oobe-actions"><button class="button ghost" id="back">Back</button><button class="button primary" id="next">Get started</button></div></footer>
  </main>
</div>
<script type="module" src="oobe.js"></script>
